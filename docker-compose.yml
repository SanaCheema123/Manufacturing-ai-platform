version: '3.9'

services:
  # ─── Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mfg_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-supersecretkey_change_in_production}
      - DATABASE_URL=postgresql://mfg_user:mfg_pass@postgres:5432/manufacturing_db
      - MONGODB_URL=mongodb://mongo:27017/manufacturing_logs
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - mfg_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Frontend ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    container_name: mfg_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mfg_network

  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mfg_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mfg_user
      - POSTGRES_PASSWORD=mfg_pass
      - POSTGRES_DB=manufacturing_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mfg_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfg_user -d manufacturing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: mfg_mongo
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=manufacturing_logs
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - mfg_network

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mfg_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - mfg_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  mfg_network:
    driver: bridge
